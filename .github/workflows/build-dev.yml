name: Build Android

on:
  push:
    branches:
      - dev-ng-9

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v2
        with:
          submodules: true
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 24.x

      - name: Install app dependencies
        run: npm install

      - name: Create Google Services JSON File and key.jks
        working-directory: ./android/app/
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SHA_KEY: ${{ secrets.SHA_KEY }}
        run: |
          echo $GOOGLE_SERVICES_JSON | base64 -di > google-services.json
          echo $SHA_KEY | base64 -di > key.jks
      - name: Build
        env:
          CI: false
          VITE_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
          VITE_AUTH_DOMAIN: ${{ secrets.REACT_APP_AUTH_DOMAIN }}
          VITE_PROJECT_ID: ${{ secrets.REACT_APP_PROJECT_ID }}
          VITE_STORAGE_BUCKET: ${{ secrets.REACT_APP_STORAGE_BUCKET }}
          VITE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_MESSAGING_SENDER_ID }}
          VITE_APP_ID: ${{ secrets.REACT_APP_APP_ID }}
          VITE_MEASUREMENT_ID: ${{ secrets.REACT_APP_MEASUREMENT_ID}}
          VITE_ALGOLIA_APP_ID: ${{ secrets.REACT_APP_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_API_KEY: ${{ secrets.REACT_APP_ALGOLIA_API_KEY }}
          VITE_HOT_UPDATE_SERVER: ${{ secrets.SUPABASE_DEV_HOT_UPDATE_SERVER }}
          VITE_ALGOLIA_INDEX_NAME: ${{ secrets.REACT_APP_ALGOLIA_INDEX_NAME}}
          VITE_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL}}
          VITE_SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_KEY}}
          VITE_CLIENT_ID: ${{ secrets.REACT_APP_CLIENT_ID}}
          VITE_GROWTHBOOK_ID: ${{ secrets.REACT_APP_GROWTHBOOK_ID_DEV }}
          VITE_RAPIDAPI_KEY: ${{ secrets.REACT_APP_RAPIDAPI_KEY }}
          VITE_PERISKOPE_API_KEY: ${{ secrets.REACT_APP_PERISKOPE_API_KEY }}
          VITE_PERISKOPE_API_BASE_URL: ${{ secrets.REACT_APP_PERISKOPE_API_BASE_URL }}
          VITE_PERISKOPE_PHONE_NUMBER: ${{ secrets.REACT_APP_PERISKOPE_PHONE_NUMBER }}
          VITE_MAYTAPI_API_KEY: ${{ secrets.REACT_APP_MAYTAPI_API_KEY }}
          VITE_MAYTAPI_PRODUCT_ID: ${{ secrets.REACT_APP_MAYTAPI_PRODUCT_ID }}
          VITE_MAYTAPI_PHONE_ID: ${{ secrets.REACT_APP_MAYTAPI_PHONE_ID }}
          VITE_MAYTAPI_API_BASE_URL: ${{ secrets.REACT_APP_MAYTAPI_API_BASE_URL }}
          VITE_ENCRYPTION_KEY: ${{ secrets.REACT_APP_ENCRYPTION_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.REACT_APP_SENTRY_DSN }}
          VITE_CAPACITOR_HOT_UPDATE_APP_ID: ${{ secrets.REACT_APP_CAPACITOR_HOT_UPDATE_APP_ID }}
          VITE_ENV: ${{ vars.REACT_APP_ENV_DEV }}
          VITE_ENVIRONMENT: ${{ vars.REACT_APP_ENV_DEV }}
          VITE_LOG_LEVEL: ${{ vars.REACT_APP_LOG_LEVEL_DEV }}

        run: npm run build

      - name: Make gradlew executable
        working-directory: ./android/
        run: chmod +x ./gradlew

      - name: Generate the Android App assembleDebug
        working-directory: ./android/
        run: ./gradlew assembleDebug
